<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19221e"/>
      <stop offset="100%" stop-color="#0b100e"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e08b68" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="peachGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5a484"/>
      <stop offset="100%" stop-color="#e08b68"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Tile 1 (Peach) -->
  <rect x="18" y="18" width="42" height="42" rx="12" fill="url(#peachGrad)"/>
  <text x="39" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="900" fill="#141916" text-anchor="middle" dominant-baseline="middle">1</text>

  <!-- Tile 2 (Emerald / Green) -->
  <rect x="68" y="18" width="42" height="42" rx="12" fill="url(#emeraldGrad)"/>
  <text x="89" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="900" fill="#0b1d15" text-anchor="middle" dominant-baseline="middle">2</text>

  <!-- Tile 3 (Dark Slate) -->
  <rect x="18" y="68" width="42" height="42" rx="12" fill="#1e2723" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
  <text x="39" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="900" fill="#edebe6" text-anchor="middle" dominant-baseline="middle">3</text>

  <!-- Tile 4 (Sparkle Star) -->
  <rect x="68" y="68" width="42" height="42" rx="12" fill="#1e2723" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
  <path d="M 89 77 C 89 84 89 89 98 89 C 89 89 89 94 89 101 C 89 94 89 89 80 89 C 89 89 89 84 89 77 Z" fill="#e08b68"/>
</svg>

